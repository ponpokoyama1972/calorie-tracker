<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="カロリー記録" />
<title>カロリー記録</title>
<link rel="apple-touch-icon" href="icon.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f7f6f4; font-family: 'Hiragino Sans', 'Yu Gothic', sans-serif; }
  button { font-family: inherit; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

const todayStr = () => {
  const d = new Date();
  return [d.getFullYear(), String(d.getMonth()+1).padStart(2,"0"), String(d.getDate()).padStart(2,"0")].join("-");
};

const BUDGET_DEFAULT = 2000;

const FOOD_DB = {
  主食: [
    {name:"白米(150g)",kcal:252},{name:"白米(200g)",kcal:336},
    {name:"食パン1枚",kcal:158},{name:"おにぎり1個",kcal:170},
    {name:"うどん(1玉)",kcal:240},{name:"そば(1玉)",kcal:230},
    {name:"パスタ(乾80g)",kcal:284},{name:"雑炊(1杯)",kcal:150},
  ],
  汁物: [
    {name:"味噌汁",kcal:35},{name:"豚汁",kcal:120},
    {name:"スープ",kcal:50},{name:"コンソメスープ",kcal:20},
  ],
  メイン: [
    {name:"鶏胸肉ソテー",kcal:200},{name:"鮭の塩焼き",kcal:180},
    {name:"豚しょうが焼き",kcal:320},{name:"ハンバーグ",kcal:380},
    {name:"唐揚げ3個",kcal:270},{name:"目玉焼き",kcal:100},
    {name:"卵焼き",kcal:120},{name:"豆腐(1/2丁)",kcal:80},{name:"納豆1パック",kcal:95},
  ],
  サブ: [
    {name:"ほうれん草おひたし",kcal:30},{name:"きんぴらごぼう",kcal:80},
    {name:"ひじき煮",kcal:60},{name:"冷奴",kcal:60},
    {name:"サラダ(小)",kcal:50},{name:"ポテトサラダ",kcal:150},
  ],
  添え物: [
    {name:"キャベツ千切り",kcal:20},{name:"レタス",kcal:10},
    {name:"トマト1個",kcal:35},{name:"きゅうり",kcal:15},
    {name:"梅干し1個",kcal:10},{name:"漬物小鉢",kcal:20},
  ],
  飲物: [
    {name:"水/お茶(0kcal)",kcal:0},{name:"ブラックコーヒー",kcal:5},
    {name:"牛乳200ml",kcal:134},{name:"豆乳200ml",kcal:92},
    {name:"オレンジジュース",kcal:90},{name:"スポーツドリンク",kcal:50},
  ],
  "⭐三ツ星": [
    {name:"ローストチキン",kcal:290},{name:"サーモンフライ",kcal:310},
    {name:"デミグラスハンバーグ",kcal:380},{name:"ガパオライス",kcal:420},
    {name:"海老マヨ",kcal:260},{name:"鶏のトマト煮",kcal:250},
    {name:"豚の生姜焼き",kcal:340},{name:"チキン南蛮",kcal:400},
    {name:"鮭の西京焼き",kcal:220},{name:"豆腐ハンバーグ",kcal:280},
    {name:"チキンソテー",kcal:300},{name:"麻婆豆腐",kcal:350},
    {name:"ビーフカレー(1食)",kcal:480},{name:"グリーンカレー",kcal:430},
    {name:"パスタ(ミート)",kcal:520},
  ],
};

const CATS = Object.keys(FOOD_DB);
const MEAL_SLOTS = ["朝食","昼食","夕食","間食"];

const loadDay = (date) => {
  try { const r = localStorage.getItem("calorie_"+date); return r ? JSON.parse(r) : {朝食:[],昼食:[],夕食:[],間食:[]}; }
  catch { return {朝食:[],昼食:[],夕食:[],間食:[]}; }
};
const saveDay = (date, data) => { try { localStorage.setItem("calorie_"+date, JSON.stringify(data)); } catch {} };
const loadBudget = () => { try { return parseInt(localStorage.getItem("calorie_budget")) || BUDGET_DEFAULT; } catch { return BUDGET_DEFAULT; } };
const saveBudget = (b) => { try { localStorage.setItem("calorie_budget", String(b)); } catch {} };

// ── バックアップ関数（追加） ──────────────────────────
const exportBackup = () => {
  const backup = { exportedAt: new Date().toISOString(), budget: loadBudget(), days: {} };
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (key && key.startsWith("calorie_")) {
      const dateKey = key.replace("calorie_", "");
      try { backup.days[dateKey] = JSON.parse(localStorage.getItem(key)); } catch {}
    }
  }
  const blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `calorie_backup_${todayStr()}.json`;
  a.click();
  URL.revokeObjectURL(url);
};

function App() {
  const [date, setDate] = useState(() => todayStr());
  const [meals, setMeals] = useState(() => loadDay(todayStr()));
  const [budget, setBudget] = useState(() => loadBudget());
  const [openSlot, setOpenSlot] = useState(null);
  const [activeCat, setActiveCat] = useState(CATS[0]);
  const [editingKcal, setEditingKcal] = useState(null);
  const [editingKcalVal, setEditingKcalVal] = useState("");
  const [budgetEdit, setBudgetEdit] = useState(false);
  const [budgetVal, setBudgetVal] = useState("");
  const [customName, setCustomName] = useState("");
  const [customKcal, setCustomKcal] = useState("");
  const [customQty, setCustomQty] = useState("1");

  const isToday = date === todayStr();

  useEffect(() => { setMeals(loadDay(date)); }, [date]);

  const shiftDate = (delta) => {
    const [dy, dm, dd] = date.split("-").map(Number);
    const d = new Date(dy, dm-1, dd);
    d.setDate(d.getDate() + delta);
    const next = [d.getFullYear(), String(d.getMonth()+1).padStart(2,"0"), String(d.getDate()).padStart(2,"0")].join("-");
    if (next > todayStr()) return;
    setDate(next); setOpenSlot(null);
  };

  const addFood = (slot, food) => {
    setMeals(prev => {
      const updated = {...prev, [slot]: [...prev[slot], {...food, id: Date.now()+Math.random()}]};
      saveDay(date, updated); return updated;
    });
  };

  const removeFood = (slot, id) => {
    setMeals(prev => {
      const updated = {...prev, [slot]: prev[slot].filter(f => f.id !== id)};
      saveDay(date, updated); return updated;
    });
  };

  const updateKcal = (slot, idx, val) => {
    const n = parseInt(val);
    if (isNaN(n) || n < 0) return;
    setMeals(prev => {
      const arr = [...prev[slot]];
      arr[idx] = {...arr[idx], kcal: n, edited: true};
      const updated = {...prev, [slot]: arr};
      saveDay(date, updated); return updated;
    });
    setEditingKcal(null);
  };

  const addCustom = (slot) => {
    const k = parseInt(customKcal);
    const q = parseFloat(customQty) || 1;
    if (!customName.trim() || isNaN(k) || k < 0) return;
    const totalKcal = Math.round(k * q);
    const label = q !== 1 ? `${customName.trim()}×${q}` : customName.trim();
    addFood(slot, {name: label, kcal: totalKcal});
    setCustomName(""); setCustomKcal(""); setCustomQty("1");
  };

  const totalKcal = Object.values(meals).flat().reduce((s,f) => s+f.kcal, 0);
  const remaining = budget - totalKcal;
  const pct = Math.min(100, Math.round(totalKcal/budget*100));
  const over = totalKcal > budget;

  const fmtDate = (d) => {
    const [fy, fm, fd] = d.split("-").map(Number);
    const obj = new Date(fy, fm-1, fd);
    const days = ["日","月","火","水","木","金","土"];
    return `${obj.getMonth()+1}月${obj.getDate()}日(${days[obj.getDay()]})`;
  };

  return (
    <div style={{fontFamily:"'Hiragino Sans',sans-serif",maxWidth:420,margin:"0 auto",padding:"12px 12px 80px",background:"#f7f6f4",minHeight:"100vh",fontSize:14}}>

      {/* ヘッダー */}
      <div style={{background:"#fff",borderRadius:14,padding:"14px 16px",marginBottom:10,boxShadow:"0 1px 4px rgba(0,0,0,0.07)"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:4}}>
          <span style={{fontSize:16,fontWeight:700,color:"#333"}}>{fmtDate(date)}</span>
          {isToday && <span style={{fontSize:11,background:"#4CAF50",color:"#fff",borderRadius:8,padding:"2px 8px"}}>今日</span>}
        </div>
        <div style={{fontSize:26,fontWeight:800,color:over?"#ef5350":"#333",textAlign:"center"}}>
          {totalKcal} <span style={{fontSize:14,fontWeight:400}}>kcal</span>
        </div>
        <div style={{fontSize:12,color:"#999",textAlign:"center",marginTop:2}}>
          {over ? `⚠️ ${Math.abs(remaining)} kcal オーバー` : `残り ${remaining} kcal`}
        </div>
        <div style={{background:"#eee",borderRadius:8,height:10,margin:"10px 0 6px"}}>
          <div style={{height:10,borderRadius:8,background:over?"#ef5350":"#66bb6a",width:pct+"%",transition:"width .3s"}} />
        </div>
        <div style={{display:"flex",justifyContent:"space-between",fontSize:12,color:"#888"}}>
          <span>0</span><span>{pct}%</span><span>{budget}</span>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8,justifyContent:"center",marginTop:8}}>
          <span style={{fontSize:12,color:"#999"}}>目標:</span>
          {budgetEdit ? (
            <>
              <input type="number" value={budgetVal} onChange={e=>setBudgetVal(e.target.value)}
                style={{width:70,fontSize:13,border:"1px solid #1976d2",borderRadius:6,padding:"2px 6px"}} autoFocus />
              <button onClick={()=>{const n=parseInt(budgetVal);if(!isNaN(n)&&n>0){setBudget(n);saveBudget(n);}setBudgetEdit(false);}}
                style={{background:"#1976d2",color:"#fff",border:"none",borderRadius:16,padding:"4px 12px",fontSize:12,cursor:"pointer"}}>確定</button>
            </>
          ) : (
            <span onClick={()=>{setBudgetVal(String(budget));setBudgetEdit(true);}}
              style={{fontSize:13,color:"#1976d2",cursor:"pointer",textDecoration:"underline dotted"}}>{budget} kcal ✏️</span>
          )}
        </div>
      </div>

      {/* 食事スロット */}
      {MEAL_SLOTS.map(slot => {
        const items = meals[slot] || [];
        const slotKcal = items.reduce((s,f)=>s+f.kcal,0);
        const open = openSlot === slot;
        return (
          <div key={slot} style={{background:"#fff",borderRadius:14,padding:"12px 14px",marginBottom:10,boxShadow:"0 1px 4px rgba(0,0,0,0.07)"}}>
            <button onClick={()=>setOpenSlot(open?null:slot)}
              style={{width:"100%",textAlign:"left",background:open?"#e8f5e9":"#fafafa",border:"1px solid "+(open?"#a5d6a7":"#e0e0e0"),borderRadius:10,padding:"10px 14px",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:items.length>0||open?8:0}}>
              <span style={{fontWeight:700,color:"#333"}}>{slot}</span>
              <span style={{fontSize:13,color:"#888"}}>{slotKcal>0?`${slotKcal} kcal`:"未入力"} {open?"▲":"▼"}</span>
            </button>

            {items.map((f,i) => (
              <div key={f.id} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"5px 2px",borderBottom:"1px solid #f0f0f0"}}>
                <span style={{flex:1,color:"#444",fontSize:13}}>{f.name}</span>
                {editingKcal?.slot===slot&&editingKcal?.idx===i ? (
                  <input type="number" value={editingKcalVal}
                    onChange={e=>setEditingKcalVal(e.target.value)}
                    onBlur={()=>updateKcal(slot,i,editingKcalVal)}
                    style={{width:56,fontSize:13,border:"1px solid #1976d2",borderRadius:6,padding:"2px 4px",textAlign:"right"}} autoFocus />
                ) : (
                  <span onClick={()=>{setEditingKcal({slot,idx:i});setEditingKcalVal(String(f.kcal));}}
                    style={{fontSize:13,color:"#1976d2",cursor:"pointer",marginRight:4,minWidth:60,textAlign:"right"}}>
                    {f.kcal}{f.edited?"*":""} kcal
                  </span>
                )}
                <button onClick={()=>removeFood(slot,f.id)}
                  style={{color:"#e57373",background:"none",border:"none",cursor:"pointer",fontSize:18,padding:"0 4px"}}>×</button>
              </div>
            ))}

            {open && (
              <div style={{marginTop:8}}>
                <div style={{display:"flex",gap:6,overflowX:"auto",paddingBottom:6,marginBottom:8}}>
                  {CATS.map(c=>(
                    <button key={c} onClick={()=>setActiveCat(c)}
                      style={{whiteSpace:"nowrap",padding:"5px 10px",borderRadius:20,border:"none",cursor:"pointer",fontSize:12,
                        background:activeCat===c?(c==="⭐三ツ星"?"#ffd54f":"#1976d2"):(c==="⭐三ツ星"?"#fff9c4":"#eee"),
                        color:activeCat===c?(c==="⭐三ツ星"?"#7b5800":"#fff"):(c==="⭐三ツ星"?"#7b5800":"#555"),
                        fontWeight:activeCat===c?700:400}}>
                      {c}
                    </button>
                  ))}
                </div>

                <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:12}}>
                  {FOOD_DB[activeCat].map(f=>(
                    <button key={f.name} onClick={()=>addFood(slot,f)}
                      style={{padding:"6px 10px",borderRadius:20,border:"1px solid "+(activeCat==="⭐三ツ星"?"#ffd54f":"#ddd"),
                        background:activeCat==="⭐三ツ星"?"#fffde7":"#f5f5f5",cursor:"pointer",fontSize:12,color:"#444",textAlign:"center"}}>
                      {f.name}<br/><span style={{color:"#999",fontSize:11}}>{f.kcal} kcal</span>
                    </button>
                  ))}
                </div>

                <div style={{background:"#f0f4ff",borderRadius:10,padding:"10px 12px",borderTop:"1px solid #e0e8ff"}}>
                  <div style={{fontSize:11,fontWeight:700,color:"#1976d2",marginBottom:6}}>✏️ カスタム入力</div>
                  <input type="text" placeholder="食品名" value={customName} onChange={e=>setCustomName(e.target.value)}
                    style={{width:"100%",fontSize:13,border:"1px solid #bbdefb",borderRadius:8,padding:"7px 10px",marginBottom:6,outline:"none"}} />
                  <div style={{display:"flex",gap:4,alignItems:"center"}}>
                    <input type="number" placeholder="kcal" value={customKcal} onChange={e=>setCustomKcal(e.target.value)}
                      style={{width:70,fontSize:13,border:"1px solid #bbdefb",borderRadius:8,padding:"7px 6px",outline:"none"}} />
                    <span style={{fontSize:12,color:"#999"}}>×</span>
                    <input type="number" placeholder="数量" value={customQty} onChange={e=>setCustomQty(e.target.value)}
                      style={{width:50,fontSize:13,border:"1px solid #bbdefb",borderRadius:8,padding:"7px 6px",outline:"none"}} />
                    <button onClick={()=>addCustom(slot)}
                      style={{flex:1,background:"#1976d2",color:"#fff",border:"none",borderRadius:8,padding:"8px 6px",fontSize:13,cursor:"pointer",fontWeight:600}}>
                      追加
                    </button>
                  </div>
                  <div style={{fontSize:10,color:"#90a4ae",marginTop:5}}>
                    例）ヨーグルト 60kcal × 1　→　60kcal で追加
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      })}

      {/* 日付ナビ */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:8}}>
        <button onClick={()=>shiftDate(-1)}
          style={{background:"none",border:"1px solid #ddd",borderRadius:20,padding:"8px 16px",cursor:"pointer",fontSize:13,color:"#555"}}>← 前日</button>
        {!isToday && (
          <button onClick={()=>{setDate(todayStr());setOpenSlot(null);}}
            style={{background:"#1976d2",color:"#fff",border:"none",borderRadius:20,padding:"8px 18px",cursor:"pointer",fontSize:13}}>今日へ戻る</button>
        )}
        <button onClick={()=>shiftDate(1)} disabled={isToday}
          style={{background:"none",border:"1px solid #ddd",borderRadius:20,padding:"8px 16px",fontSize:13,color:"#555",cursor:isToday?"not-allowed":"pointer",opacity:isToday?0.35:1}}>翌日 →</button>
      </div>

      {/* ── バックアップボタン（追加） ── */}
      <div style={{marginTop:20,textAlign:"center"}}>
        <button onClick={exportBackup}
          style={{background:"none",border:"1px solid #bbb",borderRadius:20,padding:"8px 20px",fontSize:12,color:"#888",cursor:"pointer"}}>
          💾 データをバックアップ（JSON）
        </button>
        <div style={{fontSize:10,color:"#bbb",marginTop:4}}>
          iPhoneのファイルアプリに保存してください
        </div>
      </div>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
